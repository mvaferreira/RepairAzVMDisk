name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package release ZIP
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath 'Repair-AzVMDisk.ps1', 'README.md', 'LICENSE' -DestinationPath 'Repair-AzVMDisk.zip' -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Repair-AzVMDisk.ps1
            Repair-AzVMDisk.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
